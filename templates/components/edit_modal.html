<div id="editModal-{{ sound.id }}" class="hidden fixed inset-0 z-50 flex items-center justify-center p-0 sm:p-4">

    <div onclick="toggleEditModal({{ sound.id }})" class="absolute inset-0 bg-slate-950/60 backdrop-blur-md cursor-pointer"></div>

    <div class="relative bg-slate-900 border-t sm:border border-slate-800 w-full h-full sm:h-auto sm:max-h-[85vh] sm:w-[500px] sm:rounded-2xl shadow-2xl overflow-y-auto flex flex-col">

        <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/50 sticky top-0 backdrop-blur-sm z-10">
            <h3 class="text-xl font-black text-white tracking-tight">Edit Sound</h3>

            <button type="button"
                    onclick="toggleEditModal({{ sound.id }})"
                    class="group p-2 -mr-2 rounded-full hover:bg-slate-800 transition-all duration-200"
                    aria-label="Close Modal">
                <svg class="w-6 h-6 text-slate-400 group-hover:text-cyan-400 transition-colors"
                     fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <div class="p-8">
            <form action="/edit/{{ sound.id }}" method="post" class="space-y-6">

                {% set current_origin = 'ai' if sound.is_ai_generated else ('nature' if sound.is_environmental else 'human') %}
                {% set current_copyright = 'free' if sound.is_royalty_free else 'protected' %}

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Sound Title</label>
                    <input type="text" name="title" required value="{{ sound.title }}"
                           class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 text-slate-200 placeholder-slate-600 rounded-xl px-4 py-3 outline-none transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Mood</label>
                    <input type="text" name="ai_mood" value="{{ sound.ai_mood or '' }}"
                           class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 text-slate-200 placeholder-slate-600 rounded-xl px-4 py-3 outline-none transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Music Genre</label>
                    <input type="text" name="music_genre" value="{{ sound.music_genre or '' }}"
                           class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 text-slate-200 placeholder-slate-600 rounded-xl px-4 py-3 outline-none transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Acoustic Type</label>
                    <input type="text" name="acoustic_type" value="{{ sound.acoustic_type or '' }}"
                           class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 text-slate-200 placeholder-slate-600 rounded-xl px-4 py-3 outline-none transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Origin Country</label>
                    <input type="text" name="origin_country" value="{{ sound.origin_country or '' }}"
                           class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 text-slate-200 placeholder-slate-600 rounded-xl px-4 py-3 outline-none transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Tempo / Rhythm</label>
                    <input type="text" name="tempo_rhythm" value="{{ sound.tempo_rhythm or '' }}"
                           class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 text-slate-200 placeholder-slate-600 rounded-xl px-4 py-3 outline-none transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Main Instrument</label>
                    <input type="text" name="main_instrument" value="{{ sound.main_instrument or '' }}"
                           class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 text-slate-200 placeholder-slate-600 rounded-xl px-4 py-3 outline-none transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Instruments</label>
                    <input type="text" name="ai_instruments" value="{{ sound.ai_instruments or '' }}"
                           class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 text-slate-200 placeholder-slate-600 rounded-xl px-4 py-3 outline-none transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Tags</label>
                    <input type="text" name="ai_tags" value="{{ sound.ai_tags or '' }}"
                           class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 text-slate-200 placeholder-slate-600 rounded-xl px-4 py-3 outline-none transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Description</label>
                    <textarea name="ai_description" rows="3"
                        class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 text-slate-200 placeholder-slate-600 rounded-xl px-4 py-3 outline-none transition-all resize-none">{{- sound.ai_description or '' -}}</textarea>
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">{{ labels.origin_label }}</label>
                    <select name="origin" required
                        class="w-full bg-slate-950 border border-slate-800 text-slate-300 rounded-xl py-3 px-4 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none cursor-pointer appearance-none text-sm font-bold">
                        <option value="human" {% if current_origin == 'human' %}selected{% endif %}>{{ labels.origin_human }}</option>
                        <option value="nature" {% if current_origin == 'nature' %}selected{% endif %}>{{ labels.origin_nature }}</option>
                        <option value="ai" {% if current_origin == 'ai' %}selected{% endif %}>{{ labels.origin_ai }}</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">{{ labels.copyright_label }}</label>
                    <select name="copyright" required
                        class="w-full bg-slate-950 border border-slate-800 text-slate-300 rounded-xl py-3 px-4 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none cursor-pointer appearance-none text-sm font-bold">
                        <option value="free" {% if current_copyright == 'free' %}selected{% endif %}>{{ labels.copyright_free }}</option>
                        <option value="protected" {% if current_copyright == 'protected' %}selected{% endif %}>{{ labels.copyright_protected }}</option>
                    </select>
                </div>

                <div class="flex items-center gap-6">
                    <label class="flex items-center gap-3 text-sm cursor-pointer">
                        <input type="checkbox" name="is_orchestrated" {% if sound.is_orchestrated %}checked{% endif %}>
                        <span>Orchestrated</span>
                    </label>
                    <label class="flex items-center gap-3 text-sm cursor-pointer">
                        <input type="checkbox" name="has_vocals" {% if sound.has_vocals %}checked{% endif %}>
                        <span>Has Vocals</span>
                    </label>
                </div>

                <button type="submit"
                    class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black py-4 rounded-xl transition-all shadow-lg shadow-cyan-500/20 mt-4 active:scale-95">
                    Save Changes
                </button>
            </form>
        </div>
    </div>
</div>
